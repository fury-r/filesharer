name: Backend Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  run-backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python - <<'PY'
          from pathlib import Path
          source = Path("backend/requirements.txt")
          raw = source.read_bytes()
          try:
              text = raw.decode("utf-8")
          except UnicodeDecodeError:
              text = raw.decode("utf-16")
          lines = text.splitlines()
          required_prefixes = (
              "Django==",
              "channels==",
              "djangorestframework==",
              "django-cors-headers==",
          )
          filtered_lines = [
              line for line in lines
              if line.strip()
              and line.startswith(required_prefixes)
          ]
          Path("backend/requirements-ci.txt").write_text("\n".join(filtered_lines) + "\n", encoding="utf-8")
          PY
          python -m pip install -r backend/requirements-ci.txt "daphne==3.0.2"
        shell: bash
      - name: Run backend tests
        run: python manage.py test api.tests
        shell: bash
        working-directory: ./backend
